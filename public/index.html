<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<title>Gofile Video Zipper</title>
<style>
:root{color-scheme:dark;--bg:#10131c;--panel:#191e2b;--muted:#9ba6bc;--text:#f5f7ff;--accent:#9b8cff;--line:#2a3143}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#33305b 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}
main{width:min(100%,650px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#a99aff,#7061ed);font-size:25px;box-shadow:0 8px 30px #7766ee55}.eyebrow{font-size:12px;color:#b7adff;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.brand h1{font-size:18px;margin:0}.hero h2{font-size:clamp(28px,6vw,42px);line-height:1.15;letter-spacing:-.04em;margin:0 0 13px}.hero p{color:var(--muted);margin:0 0 25px}.card{background:#191e2beF;border:1px solid var(--line);border-radius:22px;padding:clamp(18px,5vw,30px);box-shadow:0 22px 70px #0004}.label{display:block;font-weight:650;font-size:14px;margin-bottom:9px}input{width:100%;min-height:54px;border:1px solid #3b4359;border-radius:12px;background:#10141f;color:var(--text);padding:0 15px;font:inherit;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #9b8cff25}button{width:100%;margin-top:13px;min-height:54px;border:0;border-radius:12px;background:linear-gradient(110deg,#a99aff,#7565f0);color:#111020;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{display:none;margin-top:16px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#111520;white-space:pre-wrap;overflow-wrap:anywhere}.status.show{display:block}.status.error{border-color:#874b5a;color:#ffc4cd}.hint{font-size:13px;color:var(--muted);margin-top:18px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.step{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;color:var(--muted)}.step b{display:block;color:var(--text);font-size:13px;margin-bottom:4px}.foot{text-align:center;font-size:12px;color:#7f899e;margin-top:20px}a{color:#c0b7ff}
@media(max-width:420px){body{padding:16px}.steps{grid-template-columns:1fr}.step{display:flex;gap:10px}.step b{min-width:85px}}
</style>
</head>
<body>
<main>
  <header class="brand"><div class="logo">⇩</div><div><div class="eyebrow">Simple · Free · Web</div><h1>Gofile Video Zipper</h1></div></header>
  <section class="hero"><h2>動画をまとめて、<br>ZIPでひとつに。</h2><p>公開Gofileリンクを貼り付けるだけ。動画をまとめてZIP形式でダウンロードします。</p></section>
  <section class="card">
    <form id="form">
      <label class="label" for="url">GofileのフォルダURL</label>
      <input id="url" name="url" type="url" placeholder="https://gofile.io/d/xxxxxxxx" required autocomplete="url">
      <button id="submit" type="submit">動画をZIPにまとめる ↗</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="hint">公開リンクのみ対応。パスワード付きフォルダやCAPTCHA、Gofile側で許可されていないアクセスは処理できません。</div>
  </section>
  <div class="steps"><div class="step"><b>01　リンクを貼る</b>フォルダURLを入力</div><div class="step"><b>02　動画を取得</b>公開ページから動画を探す</div><div class="step"><b>03　ZIPを保存</b>ひとつのファイルで受け取る</div></div>
  <div class="foot">個人用の試作アプリ · Gofile公式サービスとは無関係です</div>
</main>
<script>
const form=document.querySelector("#form"),button=document.querySelector("#submit"),statusBox=document.querySelector("#status");
form.addEventListener("submit",async e=>{
 e.preventDefault(); const url=document.querySelector("#url").value.trim();
 statusBox.className="status show";statusBox.textContent="公開ページを確認しています…";button.disabled=true;button.textContent="処理中…";
 try{
   const r=await fetch("/api/zip",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
   const type=r.headers.get("content-type")||"";
   if(!r.ok||type.includes("application/json")){const data=await r.json().catch(()=>({}));throw new Error(data.error||"処理に失敗しました。")}
   statusBox.textContent="ZIPを準備しました。ダウンロードを開始します。";
   const blob=await r.blob(),objectUrl=URL.createObjectURL(blob),a=document.createElement("a");a.href=objectUrl;a.download="gofile-videos.zip";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),60000);
 }catch(err){statusBox.className="status show error";statusBox.textContent=err.message}
 finally{button.disabled=false;button.textContent="動画をZIPにまとめる ↗"}
});
</script>
</body></html>
